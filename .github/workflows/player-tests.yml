name: Player regression tests

on:
  push:
    branches: [main]
    paths:
      - docs/js/*.js
      - docs/css/*.css
      - docs/index.html
      - scripts/version_assets.py
      - tests/test_version_assets.py
      - tests/*.test.cjs
      - .github/workflows/player-tests.yml
  pull_request:
    paths:
      - docs/js/*.js
      - docs/css/*.css
      - docs/index.html
      - scripts/version_assets.py
      - tests/test_version_assets.py
      - tests/*.test.cjs
      - .github/workflows/player-tests.yml

permissions:
  contents: read

jobs:
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: for file in docs/js/*.js; do node --check "$file"; done
      - name: Check language selection and stream cache busting
        run: node --test tests/*.test.cjs
      - name: Check asset versions and regression tests
        run: |
          python -m unittest discover -s tests -p 'test_version_assets.py' -v
          python scripts/version_assets.py --check
