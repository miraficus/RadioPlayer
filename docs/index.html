<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="author" content="Miraficus">
  <meta name="theme-color" content="#0a1929">
  <title>Radio Online</title>
  <link rel="icon" href="assets/favicon_white_black_border.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css?v=4e0faf5ed7ad">
  <link rel="stylesheet" href="css/player-ui.css?v=fd154c37cdb9">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Radio Online">
  <meta name="apple-mobile-web-app-title" content="Radio Online">
  <script src="js/themes.js?v=f88270d79731"></script>
  <script src="js/i18n.js?v=667cb17088ea"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <button type="button" id="left" class="brand" data-i18n-aria-label="aboutLabel" aria-label="O přehrávači Radio">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m9 8 14-5M7 9h19a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3Z"/><circle cx="12" cy="19" r="4"/><path d="M21 16h4m-4 6h4"/></svg>
        <span>Radio</span>
      </button>
      <details class="header-menu" id="header-menu">
        <summary data-i18n-aria-label="menu" aria-label="Nabídka"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></summary>
        <div class="header-options">
          <label class="menu-field"><span class="field-caption" data-i18n="appearance">Vzhled</span>
            <select name="themechoice" id="themechoice" data-i18n-aria-label="appearance" aria-label="Vzhled">
              <option value="light" data-i18n="theme.light">Světlý vzhled</option>
              <option value="dark" data-i18n="theme.dark">Tmavý vzhled</option>
              <option value="black" data-i18n="theme.black">Černý vzhled</option>
              <option value="blue" data-i18n="theme.blue" selected>Modrý vzhled</option>
              <option value="cyber" data-i18n="theme.cyber">Cyber vzhled</option>
            </select>
          </label>
          <label class="menu-field"><span class="field-caption" data-i18n="language">Jazyk</span>
            <select id="language-choice" data-i18n-aria-label="language" aria-label="Jazyk">
              <option value="cs" lang="cs">Čeština</option><option value="en" lang="en">English</option>
            </select>
          </label>
          <a href="https://github.com/miraficus/RadioPlayer" id="right" target="_blank" rel="noopener noreferrer" data-i18n="source">Zdrojový kód</a>
        </div>
      </details>
    </div>
  </header>
  <main class="app-shell">
    <section class="player" id="player" aria-labelledby="player-name">
      <audio preload="none" id="audio" hidden></audio>
      <div class="player-artwork">
        <img id="player-logo" alt="" hidden>
        <svg id="player-logo-fallback" viewBox="0 0 32 32" aria-hidden="true"><path d="m9 8 14-5M7 9h19a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3Z"/><circle cx="12" cy="19" r="4"/><path d="M21 16h4m-4 6h4"/></svg>
      </div>
      <div class="player-heading">
        <h1 id="player-name" data-i18n="loading">Načítání stanic…</h1>
        <p class="playback-state" id="playback-state" data-state="loading"><span class="state-dot" aria-hidden="true"></span><span id="playback-state-text">Načítání…</span></p>
      </div>
      <div class="custom-controls">
        <button id="custom-play-btn" type="button" disabled aria-label="Přehrát" title="Přehrát"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="custom-mute-btn" type="button" disabled aria-label="Ztlumit" aria-pressed="false" title="Ztlumit"><svg id="mute-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></button>
        <input type="range" id="volume-slider" disabled data-i18n-aria-label="volume" data-i18n-title="volume" aria-label="Hlasitost" min="0" max="100" value="80" title="Hlasitost">
      </div>
      <div class="player-settings">
        <div class="quality-wrapper"><label for="quality-selector" data-i18n="quality">Kvalita</label><select id="quality-selector" disabled><option data-i18n="loading">Načítání stanic…</option></select></div>
        <label class="autoplay-wrapper" for="autoplay"><span data-i18n="autoplay">Autoplay</span><input type="checkbox" id="autoplay" role="switch"></label>
      </div>
      <p id="player-status" role="status" hidden></p>
    </section>
    <div class="wrapper" aria-busy="true"><p class="language-header" data-i18n="loading">Načítání stanic…</p></div>
    <noscript><p>Pro přehrávání zapni JavaScript. / Enable JavaScript to play radio.</p></noscript>
  </main>
  <footer class="footer"><span id="year"></span><span aria-hidden="true"> · </span><a href="https://github.com/miraficus/RadioPlayer/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">AGPLv3</a></footer>
  <script src="js/player.js?v=769897d67d7d"></script>
</body>
</html>
